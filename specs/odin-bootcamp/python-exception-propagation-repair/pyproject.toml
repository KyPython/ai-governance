[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odin-python-exception-propagation-repair"
version = "0.1.0"
description = "Synthetic deterministic exception-propagation exercise"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

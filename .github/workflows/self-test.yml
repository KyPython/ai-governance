name: AI Governance self-test

on:
  pull_request:
    # `edited` re-runs the gate when the PR title/body (issue reference) changes.
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-governance:
    uses: ./.github/workflows/governance.yml
    with:
      require-tests: false
      # Behavioral tests for the policy gate (specs/ai-governance-gate/requirements.md).
      extra-command: python3 -m unittest discover -s tests -v

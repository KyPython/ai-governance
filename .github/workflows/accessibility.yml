# Accessibility + diff-hygiene gate (grace mode during rollout).
# Consumes shared reusable workflows from KyLamportLogic/buildlogic-governance.
# This repo declares ui:false (.a11y.yml); accessibility passes trivially,
# diff-hygiene still enforces minimal-diff discipline. Additive to existing CI.
name: Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  level-a:
    uses: KyLamportLogic/buildlogic-governance/.github/workflows/accessibility.reusable.yml@c9edd8f567bc8c800f4a3bb92b032ffedfc52329 # main
    with:
      governance-ref: c9edd8f567bc8c800f4a3bb92b032ffedfc52329

  diff-hygiene:
    uses: KyLamportLogic/buildlogic-governance/.github/workflows/diff-hygiene.reusable.yml@c9edd8f567bc8c800f4a3bb92b032ffedfc52329 # main
    with:
      governance-ref: c9edd8f567bc8c800f4a3bb92b032ffedfc52329

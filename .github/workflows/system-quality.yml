name: System quality evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: system-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install declared test dependencies
        run: python3 -m pip install -r requirements.txt
      - uses: ./.github/actions/system-quality
      - name: Retain scoped evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: system-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .quality-results/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

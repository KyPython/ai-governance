name: AI Governance (reusable)

# Reusable governance gate derived from KyLamportLogic/LamportLogic.
# Every repo that AI agents (Kiro, Codex, Cursor, Grok Bot, Claude, Copilot)
# work in calls this workflow from .github/workflows/ai-governance.yml and
# marks the `ai-governance / verdict` check as required on `main`.
#
# Source of each rule (LamportLogic path in parentheses):
#   quality      - install + lint + type-check + test + build
#                  (.github/workflows/ci.yml, .claude/hooks/verify-before-stop.mjs)
#   policy       - AGENTS.md present with governance marker (AGENTS.md, CLAUDE.md)
#                - CODEOWNERS present with a global owner (.github/CODEOWNERS)
#                - Conventional Commits PR title (.husky/commit-msg, PR template)
#                - issue reference in PR body (PR template "Closes #")
#                - SYSTEMS_THINKING_CONTRACT for structural changes
#                  (PR template, .systems-thinking/contracts/)
#                - workflow security baseline: explicit permissions + SHA-pinned
#                  actions (scripts/validate-security-baseline.js, surface W)
#   spec gate    - code PRs need an issue, a spec folder with numbered EARS acceptance
#                  criteria, and changed tests that cite those IDs (Kiro specs layout;
#                  LamportLogic requirement->test matrix; bootcamp GOLDEN_SPEC IDs)
#   secret-scan  - gitleaks over the full PR commit range, pinned + checksummed
#                  (.github/workflows/secret-scan.yml)
#   verdict      - single fail-closed aggregate to mark as the required check
#
# Untrusted event fields are passed through env, never spliced into scripts.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used when a package.json is present.
        type: string
        default: "22"
      python-version:
        description: Python version used when pyproject.toml / requirements.txt is present.
        type: string
        default: "3.12"
      working-directory:
        description: Directory containing the project manifest.
        type: string
        default: "."
      run-quality:
        description: >
          Run the quality job (install/lint/type-check/test/build). Set false only when the
          repo's own required CI already runs those on every PR (e.g. a heavy monorepo).
        type: boolean
        default: true
      workflow-baseline:
        description: "Workflow security baseline scope: changed (workflows touched by the PR/push), all, off"
        type: string
        default: "changed"
      require-tests:
        description: Fail when a project is detected but has no test command.
        type: boolean
        default: true
      extra-command:
        description: Optional repo-specific governance command run after tests (e.g. "pnpm validate:all").
        type: string
        default: ""
      require-issue-reference:
        description: >
          Fail (instead of warn) when a PR that changes no code lacks an issue reference.
          PRs that change code always need one (spec gate).
        type: boolean
        default: false
      enforce-conventional-title:
        description: Fail when the PR title is not a Conventional Commit.
        type: boolean
        default: true
      systems-thinking-contract:
        description: "auto = required when .systems-thinking/contracts/ exists; required; off"
        type: string
        default: "auto"
    outputs:
      verdict:
        description: "pass or fail"
        value: ${{ jobs.verdict.outputs.verdict }}
      summary:
        description: "Scorecard JSON (schema ai-governance-summary/v1); also in the job summary and the ai-governance-summary artifact"
        value: ${{ jobs.verdict.outputs.summary }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  quality:
    name: quality
    if: inputs.run-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tests_passed: ${{ steps.tests.outputs.passed }}
      tests_failed: ${{ steps.tests.outputs.failed }}
      tests_total: ${{ steps.tests.outputs.total }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Detect project type
        id: detect
        run: |
          set -euo pipefail
          pm=none
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then pm=pnpm
            elif [ -f yarn.lock ]; then pm=yarn
            else pm=npm; fi
          elif [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            pm=python
          fi
          echo "pm=${pm}" >> "$GITHUB_OUTPUT"
          echo "Detected package manager: ${pm}"
          echo "### quality: package manager \`${pm}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.detect.outputs.pm == 'pnpm' || steps.detect.outputs.pm == 'npm' || steps.detect.outputs.pm == 'yarn'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Python
        if: steps.detect.outputs.pm == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install, lint, type-check, test, build
        env:
          PM: ${{ steps.detect.outputs.pm }}
          REQUIRE_TESTS: ${{ inputs.require-tests }}
        run: |
          set -euo pipefail
          summary() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ "$PM" = "none" ]; then
            echo "::notice::No package.json / pyproject.toml / requirements.txt found; nothing to build or test."
            summary "no project manifest detected - skipped"
            exit 0
          fi

          if [ "$PM" = "python" ]; then
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
            if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e . || true; fi
            pip install ruff mypy pytest
            uses_tool() { grep -qs "$1" pyproject.toml setup.cfg requirements*.txt "$2" 2>/dev/null; }
            if uses_tool ruff ruff.toml; then ruff check . && summary "lint: ruff check passed"; else summary "lint: ruff not configured - skipped"; fi
            if uses_tool mypy mypy.ini; then mypy . && summary "type-check: mypy passed"; else summary "type-check: mypy not configured - skipped"; fi
            if [ -d tests ] || [ -d test ] || ls test_*.py >/dev/null 2>&1; then
              pytest 2>&1 | tee -a "$RUNNER_TEMP/test-output.log" && summary "test: pytest passed"
            elif [ "$REQUIRE_TESTS" = "true" ]; then
              echo "::error::No tests found (tests/, test/ or test_*.py). AI-authored changes must ship with tests."
              exit 1
            else
              summary "test: none found - skipped (require-tests=false)"
            fi
            exit 0
          fi

          # Node: corepack honours package.json "packageManager" (no third-party action needed).
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
            npm)  if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
          esac
          summary "install: ${PM} ok"

          has_script() { node -e 'const s=require("./package.json").scripts||{}; process.exit(s[process.argv[1]]?0:1)' "$1"; }
          run_script() {
            if [ "$PM" = "npm" ]; then npm run "$1"; else "$PM" run "$1"; fi
          }

          if has_script lint; then run_script lint; summary "lint: passed"; else summary "lint: no \`lint\` script - skipped"; fi

          if has_script type-check; then run_script type-check; summary "type-check: passed"
          elif has_script typecheck; then run_script typecheck; summary "typecheck: passed"
          else summary "type-check: no \`type-check\`/\`typecheck\` script - skipped"; fi

          if has_script test; then run_script test 2>&1 | tee -a "$RUNNER_TEMP/test-output.log"; summary "test: passed"
          elif [ "$REQUIRE_TESTS" = "true" ]; then
            echo "::error::No \`test\` script in package.json. AI-authored changes must ship with tests."
            exit 1
          else summary "test: no \`test\` script - skipped (require-tests=false)"; fi

          if has_script build; then run_script build; summary "build: passed"; else summary "build: no \`build\` script - skipped"; fi

      - name: Repo-specific governance command
        if: inputs.extra-command != ''
        env:
          EXTRA_COMMAND: ${{ inputs.extra-command }}
        run: |
          set -euo pipefail
          echo "Running: ${EXTRA_COMMAND}"
          bash -c "${EXTRA_COMMAND}" 2>&1 | tee -a "$RUNNER_TEMP/test-output.log"
          echo "- extra: \`${EXTRA_COMMAND}\` passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Parse test results (scorecard)
        id: tests
        if: always()
        shell: python3 {0}
        run: |
          # TEST-PARSER: best-effort counts from Jest, Vitest, pytest, unittest, node:test and Mocha output.
          import os, re
          from pathlib import Path
          def parse(text):
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              p = f = t = 0; seen = False; ut_ran = None
              def n(rx, line):
                  m = re.search(rx, line); return int(m.group(1)) if m else 0
              for line in text.splitlines():
                  s = line.strip()
                  if re.match(r"^Tests:\s.*\btotal\b", s):                                   # Jest
                      seen = True; p += n(r"(\d+) passed", s); f += n(r"(\d+) failed", s); t += n(r"(\d+) total", s)
                  elif re.match(r"^Tests\s+.*\(\d+\)$", s):                                  # Vitest
                      seen = True; p += n(r"(\d+) passed", s); f += n(r"(\d+) failed", s); t += n(r"\((\d+)\)$", s)
                  elif re.match(r"^=+ .*\b(passed|failed|errors?)\b.* in [\d.]+s.*=+$", s):   # pytest
                      seen = True; ok_, bad = n(r"(\d+) passed", s), n(r"(\d+) failed", s) + n(r"(\d+) errors?", s)
                      p += ok_; f += bad; t += ok_ + bad + n(r"(\d+) skipped", s)
                  elif re.match(r"^Ran \d+ tests? in ", s):                                    # unittest
                      ut_ran = n(r"Ran (\d+)", s)
                  elif ut_ran is not None and re.match(r"^(OK|FAILED)\b", s):
                      seen = True; bad = n(r"failures=(\d+)", s) + n(r"errors=(\d+)", s); skip = n(r"skipped=(\d+)", s)
                      t += ut_ran; f += bad; p += ut_ran - bad - skip; ut_ran = None
                  elif re.match(r"^(#|ℹ) tests \d+$", s):                                      # node:test
                      seen = True; t += n(r"tests (\d+)", s)
                  elif re.match(r"^(#|ℹ) pass \d+$", s):
                      p += n(r"pass (\d+)", s)
                  elif re.match(r"^(#|ℹ) fail \d+$", s):
                      f += n(r"fail (\d+)", s)
                  elif re.match(r"^\d+ passing\b", s):                                         # Mocha
                      seen = True; p += n(r"(\d+) passing", s); t += n(r"(\d+) passing", s)
                  elif re.match(r"^\d+ failing\b", s):
                      f += n(r"(\d+) failing", s); t += n(r"(\d+) failing", s)
              return (p, f, t) if seen else None
          log = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "test-output.log"
          r = parse(log.read_text(errors="replace")) if log.is_file() else None
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              if r:
                  o.write(f"passed={r[0]}\nfailed={r[1]}\ntotal={r[2]}\n")
          print("tests:", r or "not recognized")

  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      requirement_ids: ${{ steps.policy.outputs.requirement_ids }}
      spec: ${{ steps.policy.outputs.spec }}
      policy_errors: ${{ steps.policy.outputs.policy_errors }}
      lines_added: ${{ steps.policy.outputs.lines_added }}
      lines_deleted: ${{ steps.policy.outputs.lines_deleted }}
      files_changed: ${{ steps.policy.outputs.files_changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Governance policy checks
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          REQUIRE_ISSUE: ${{ inputs.require-issue-reference }}
          ENFORCE_TITLE: ${{ inputs.enforce-conventional-title }}
          STC_MODE: ${{ inputs.systems-thinking-contract }}
          BASELINE_MODE: ${{ inputs.workflow-baseline }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          # Single role map owned by Ky; read from main so role changes apply everywhere at once.
          ROLES_URL: https://raw.githubusercontent.com/KyPython/ai-governance/main/roles.yml
        shell: python3 {0}
        run: |
          import json, os, re, subprocess, sys
          from pathlib import Path

          errors, warnings, passed = [], [], []
          def err(m): errors.append(m); print(f"::error::{m}")
          def warn(m): warnings.append(m); print(f"::warning::{m}")
          def ok(m): passed.append(m); print(f"PASS  {m}")
          def git(*a):
              return subprocess.run(["git", *a], capture_output=True, text=True).stdout

          event = os.environ.get("EVENT_NAME", "")
          is_pr = event.startswith("pull_request")
          MARKER = "AI-GOVERNANCE:v1"
          covered_ids, spec_refs = set(), []  # scorecard

          # 0. Role map (KyPython/ai-governance/roles.yml). Fails closed if it cannot be read.
          def parse_roles(text):
              # Minimal YAML subset (nested maps, lists of scalars, comments) - no third-party deps.
              root = {}; stack = [(-1, root)]; pending = None
              for raw in text.splitlines():
                  line = re.sub(r"\s+#.*$", "", raw).rstrip()
                  if not line.strip() or line.lstrip().startswith("#"):
                      continue
                  ind = len(line) - len(line.lstrip()); body_ = line.strip()
                  while stack and ind <= stack[-1][0] and not (body_.startswith("- ") and isinstance(stack[-1][1], list) and ind == stack[-1][0]):
                      stack.pop()
                  parent = stack[-1][1]
                  if body_.startswith("- "):
                      if pending is not None:
                          lst = []; pending[0][pending[1]] = lst; stack.append((ind, lst)); parent = lst; pending = None
                      parent.append(body_[2:].strip().strip("'\""))
                      continue
                  key, _, val = body_.partition(":")
                  key, val = key.strip(), val.strip().strip("'\"")
                  if val:
                      parent[key] = val; pending = None
                  else:
                      child = {}; parent[key] = child; stack.append((ind, child)); pending = (parent, key)
              return root

          roles, roles_src = None, ""
          try:
              if os.environ.get("ROLES_FILE"):
                  roles_src = os.environ["ROLES_FILE"]; roles_text = Path(roles_src).read_text()
              else:
                  import urllib.request
                  roles_src = os.environ.get("ROLES_URL", "")
                  with urllib.request.urlopen(roles_src, timeout=20) as r:
                      roles_text = r.read().decode("utf-8")
              roles = parse_roles(roles_text)
              def ids_of(role):
                  return {i.lower() for i in (roles.get("roles", {}).get(role, {}).get("identities") or [])}
              SPEC_AUTHORS, CODERS, OWNER = ids_of("spec-author"), ids_of("coder"), (roles.get("owner") or "").lower()
              spec_dirs = [d.strip().strip("/") for d in roles.get("spec_paths") or [] if d.strip()]
              if not SPEC_AUTHORS or not OWNER or not spec_dirs:
                  raise ValueError("roles.yml needs owner, spec_paths and roles.spec-author.identities")
              ok(f"role map loaded from {roles_src}: spec authors = {', '.join(sorted(SPEC_AUTHORS))}")
          except Exception as e:
              roles = None; SPEC_AUTHORS, CODERS, OWNER = set(), set(), ""
              spec_dirs = ["specs", ".kiro/specs"]
              err(f"Role map could not be loaded from {roles_src or 'roles.yml'} ({e}). The gate fails closed without it.")

          # 1. AGENTS.md present and points at the canonical governance rules.
          agents = Path("AGENTS.md")
          if not agents.is_file():
              err("AGENTS.md is missing at the repo root. Add the canonical section from KyPython/ai-governance/AGENTS.governance.md.")
          elif MARKER not in agents.read_text(encoding="utf-8", errors="replace"):
              err(f"AGENTS.md does not contain the `{MARKER}` governance section (copy it from KyPython/ai-governance/AGENTS.governance.md).")
          else:
              ok("AGENTS.md present with AI governance section")
          claude = Path("CLAUDE.md")
          if claude.is_file() and "AGENTS.md" not in claude.read_text(encoding="utf-8", errors="replace"):
              warn("CLAUDE.md exists but does not reference AGENTS.md (LamportLogic uses `@AGENTS.md`).")

          # 2. CODEOWNERS with a global owner so a human must review every path.
          co = next((p for p in [Path(".github/CODEOWNERS"), Path("CODEOWNERS"), Path("docs/CODEOWNERS")] if p.is_file()), None)
          if co is None:
              err("CODEOWNERS is missing (.github/CODEOWNERS). Every path needs a human owner, e.g. `* @KyPython`.")
          elif not any(l.split()[0] == "*" for l in co.read_text().splitlines() if l.strip() and not l.lstrip().startswith("#") and len(l.split()) > 1):
              err(f"{co} has no global `*` owner rule.")
          else:
              ok(f"{co} has a global owner")

          # Files changed by this PR / push (used by baseline, contract and notice checks).
          changed, have_range = [], False
          if is_pr:
              base = git("merge-base", os.environ.get("PR_BASE_SHA", ""), os.environ.get("PR_HEAD_SHA", "")).strip()
              if base:
                  changed = [l for l in git("diff", "--name-only", "--diff-filter=ACDMR", f"{base}..{os.environ['PR_HEAD_SHA']}").splitlines() if l]
                  have_range = True
              else:
                  warn("Could not compute PR merge-base; skipping changed-file checks.")
          elif event == "push":
              before, after = os.environ.get("PUSH_BEFORE", ""), os.environ.get("PUSH_AFTER", "")
              if before and set(before) != {"0"} and subprocess.run(["git", "cat-file", "-e", before + "^{commit}"]).returncode == 0:
                  changed = [l for l in git("diff", "--name-only", "--diff-filter=ACDMR", f"{before}..{after}").splitlines() if l]
                  have_range = True

          # 3. Workflow security baseline: explicit permissions + SHA-pinned `uses:`.
          #    "changed" (default) blocks NEW violations without failing on pre-existing debt.
          bmode = (os.environ.get("BASELINE_MODE") or "changed").lower()
          wf_dir = Path(".github/workflows")
          sha_re = re.compile(r"@[0-9a-f]{40}$")
          all_wfs = sorted(list(wf_dir.glob("*.yml")) + list(wf_dir.glob("*.yaml"))) if wf_dir.is_dir() else []
          if bmode == "off":
              all_wfs = []
          elif bmode == "changed" and have_range:
              all_wfs = [w for w in all_wfs if str(w) in changed]
          for wf in all_wfs:
              text = wf.read_text(encoding="utf-8", errors="replace")
              if not re.search(r"^\s*permissions\s*:", text, re.M):
                  err(f"{wf}: no `permissions:` block (Security Baseline requires least-privilege permissions).")
              for n, line in enumerate(text.splitlines(), 1):
                  m = re.match(r"^\s*(?:-\s*)?uses\s*:\s*['\"]?([^'\"\s#]+)", line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith("./") or ref.startswith("docker://"):
                      continue
                  if not sha_re.search(ref):
                      err(f"{wf}:{n}: `{ref}` is not pinned to a full 40-char commit SHA.")
          if wf_dir.is_dir() and bmode != "off":
              ok(f"workflow security baseline evaluated ({bmode}: {len(all_wfs)} file(s))")

          if is_pr:
              title = os.environ.get("PR_TITLE", "")
              body = os.environ.get("PR_BODY", "") or ""
              head_ref = os.environ.get("PR_HEAD_REF", "")

              # 4. Conventional Commits title (squash-merge makes it the commit message).
              cc = re.compile(r"^(feat|fix|docs|test|refactor|style|chore|ci|perf|build|revert)(\([^)]+\))?!?: .{1,100}$")
              if cc.match(title):
                  ok("PR title follows Conventional Commits")
              elif os.environ.get("ENFORCE_TITLE") == "true":
                  err(f"PR title `{title}` is not `<type>(<scope>): <description>` (types: feat|fix|docs|test|refactor|style|chore|ci|perf|build|revert).")
              else:
                  warn(f"PR title `{title}` is not a Conventional Commit.")

              # 5. Issue reference (PR template: "Closes #"). Mandatory for code PRs (spec gate, 8).
              has_issue = bool(re.search(r"(?i)\b(close[sd]?|fix(e[sd])?|resolve[sd]?|relates? to|refs?)\b:?\s+([\w.-]+/[\w.-]+)?#\d+", body) or re.search(r"https://github\.com/[\w.-]+/[\w.-]+/issues/\d+", body))
              if has_issue:
                  ok("PR references an issue")
              elif os.environ.get("REQUIRE_ISSUE") == "true":
                  err("PR body does not reference an issue (add `Closes #<n>` or `Relates to #<n>`).")
              else:
                  warn("PR body does not reference an issue (`Closes #<n>`).")

          # 6. SYSTEMS_THINKING_CONTRACT for structural changes.
          mode = (os.environ.get("STC_MODE") or "auto").lower()
          contracts_dir = Path(".systems-thinking/contracts")
          enforce_stc = mode == "required" or (mode == "auto" and contracts_dir.is_dir())
          structural_re = re.compile(r"^(packages/|\.github/workflows/|scripts/validate|docs/quality/|docs/architecture/|apps/tools/skeleton-base/)|(^|/)(AGENTS\.md|CLAUDE\.md|\.cursorrules(\.md)?|SPEC\.md|empire-spec\.md)$|^\.cursor/rules/")
          structural = [f for f in changed if structural_re.search(f)]
          if enforce_stc and structural:
              contracts = [f for f in changed if f.startswith(".systems-thinking/contracts/") and f.endswith(".json") and Path(f).is_file()]
              if not contracts:
                  err("Structural change without a SYSTEMS_THINKING_CONTRACT. Add .systems-thinking/contracts/<date>-<slug>.json covering: " + ", ".join(structural))
              else:
                  keys = ["event", "pattern", "structure", "archetype", "intervention", "leading_indicators", "transfer"]
                  scopes = []
                  for c in contracts:
                      try:
                          d = json.loads(Path(c).read_text())
                      except Exception as e:
                          err(f"{c}: invalid JSON ({e})"); continue
                      if d.get("type") != "SYSTEMS_THINKING_CONTRACT":
                          err(f"{c}: `type` must be SYSTEMS_THINKING_CONTRACT")
                      missing = [k for k in keys if not str(d.get(k, "")).strip()]
                      if missing:
                          err(f"{c}: empty or missing steps: {', '.join(missing)}")
                      scopes += [s for s in d.get("scope", []) if isinstance(s, str)]
                  uncovered = [f for f in structural if not any(f == s or f.startswith(s.rstrip("/") + "/") or (s.endswith("/") and f.startswith(s)) for s in scopes)]
                  if uncovered:
                      err("SYSTEMS_THINKING_CONTRACT scope does not cover: " + ", ".join(uncovered))
                  else:
                      ok("SYSTEMS_THINKING_CONTRACT covers all structural paths")
          elif structural:
              warn("Structural paths changed (no contract enforced in this repo): " + ", ".join(structural))

          # 8. SPEC GATE (no spec, no code). Format: Kiro-style spec folder
          #    <spec-dir>/<slug>/requirements.md with numbered EARS acceptance criteria
          #    ("GOV-1.1 WHEN ... THEN the system SHALL ..."), traced from tests by ID
          #    (LamportLogic AUTH-REQ-001 matrix / EO-1 trace; bootcamp [R-SPEC-F1] IDs).
          #    Exemption is by explicit path rule only - never by label, branch name or author.
          #    Specs are written by Kiro (or Ky) in spec-only PRs and must exist on the base branch
          #    before a code PR references them; a PR may not change code and specs together.
          if is_pr:
              DOC_RE = re.compile(r"\.(md|mdx|rst|txt|adoc|png|jpe?g|gif|svg|webp|ico|pdf)$|(^|/)(docs?/|LICENSE|NOTICE|CHANGELOG)|(^|/)\.cursorrules$|^\.cursor/rules/", re.I)
              META_RE = re.compile(r"^(" + "|".join(re.escape(d) + "/" for d in spec_dirs) + r"|\.systems-thinking/|\.ai-governance/contracts/)")
              CONFIG_RE = re.compile(r"(^|/)(\.gitignore|\.gitattributes|\.editorconfig|\.prettierrc(\.\w+)?|\.prettierignore|\.npmrc|\.nvmrc|\.node-version|\.python-version|CODEOWNERS)$|^\.github/(workflows/[^/]+\.ya?ml$|ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE|dependabot\.ya?ml$)")
              LOCK_RE = re.compile(r"(^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock|poetry\.lock|Pipfile\.lock|uv\.lock|Cargo\.lock|go\.sum)$")
              DEP_KEYS = {"dependencies", "devDependencies", "optionalDependencies", "peerDependencies", "packageManager", "overrides", "resolutions", "pnpm"}
              base = git("merge-base", os.environ.get("PR_BASE_SHA", ""), os.environ.get("PR_HEAD_SHA", "")).strip()

              def dependency_only_manifest(f):
                  # package.json counts as non-code only when nothing but dependency keys changed.
                  if not re.search(r"(^|/)package\.json$", f) or not base or not Path(f).is_file():
                      return False
                  old = subprocess.run(["git", "show", f"{base}:{f}"], capture_output=True, text=True)
                  if old.returncode != 0:
                      return False
                  try:
                      a, b = json.loads(old.stdout), json.loads(Path(f).read_text())
                  except Exception:
                      return False
                  strip = lambda d: {k: v for k, v in d.items() if k not in DEP_KEYS}
                  return strip(a) == strip(b)

              def exempt(f):
                  return bool(DOC_RE.search(f) or META_RE.search(f) or CONFIG_RE.search(f) or LOCK_RE.search(f)
                              or re.search(r"(^|/)requirements[\w.-]*\.txt$", f) or dependency_only_manifest(f)
                              or (os.environ.get("REPO") == "KyPython/ai-governance" and f == "roles.yml"))

              code = [f for f in changed if not exempt(f)]
              spec_changes = [f for f in changed if any(f.startswith(d + "/") for d in spec_dirs)]
              if not code:
                  if spec_changes:
                      ok("spec gate: spec-only PR (" + ", ".join(spec_changes) + "); Ky reviews and merges specs before code is built from them")
                  else:
                      ok("spec gate: no code paths changed (exempt by path rule)")
              else:
                  print("Code paths requiring a spec: " + ", ".join(code))
                  if not has_issue:
                      err("Spec gate: this PR changes code, so it must link an issue (`Closes #<n>` / `Relates to #<n>`).")
                  # Specs are authored by Kiro (or Ky) and merged first; coders implement them.
                  if spec_changes:
                      err("Spec gate: this PR changes code AND spec files (" + ", ".join(spec_changes) + "). Coding agents do not write their own specs: "
                          "move the spec into its own spec-only PR (authored by Kiro or Ky), get it merged, then reference it here with `Spec: <dir>/<slug>`.")
                  # The spec must be referenced in the body and already exist on the base branch.
                  base_ref = os.environ.get("PR_BASE_SHA", "")
                  def base_text(path):
                      for rev in (base_ref, base):
                          if rev:
                              r = subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True, text=True)
                              if r.returncode == 0:
                                  return r.stdout
                      return None
                  folders = set()
                  for m in re.finditer(r"(?im)^\W*specs?\W*:[\s*`]*([\w./-]+)", body):
                      folders.add(re.sub(r"/(requirements|design|tasks)\.md$", "", m.group(1)).strip("/"))
                  crit_re = re.compile(r"^\s*(?:[-*]|\d+[.)])?\s*\**`?\[?([A-Z][A-Z0-9]*(?:-[A-Z0-9]+)*-\d+\.\d+)\]?`?\**[:.)]?\s.*\bSHALL\b", re.M)
                  ids, valid = set(), []
                  for folder in sorted(folders):
                      req = f"{folder}/requirements.md"
                      if not any(folder.startswith(d + "/") and folder.count("/") == d.count("/") + 1 for d in spec_dirs):
                          err(f"Spec gate: `Spec: {folder}` must name a folder `<dir>/<slug>` inside the spec dirs ({', '.join(spec_dirs)}).")
                          continue
                      text = base_text(req)
                      if text is None:
                          err(f"Spec gate: `{req}` does not exist on the base branch. Specs must be merged to the base branch (spec-only PR, authored by Kiro or Ky) before code is built from them.")
                          continue
                      found = set(crit_re.findall(text))
                      if not found:
                          err(f"Spec gate: `{req}` has no numbered EARS acceptance criteria (e.g. `GOV-1.1 WHEN <trigger> THEN the system SHALL <response>`).")
                          continue
                      ids |= found; valid.append(req); spec_refs.append(folder)
                  if not folders:
                      err("Spec gate: code changed but the PR body references no spec. Add a line `Spec: specs/<slug>` (or `.kiro/specs/<slug>`) naming a spec that already exists on the base branch.")
                  elif valid:
                      ok(f"spec gate: {len(ids)} acceptance criteria in {', '.join(valid)} (on base branch)")
                  # Traceability: a changed test must cite a criterion ID (or its requirement ID).
                  TEST_RE = re.compile(r"(^|/)(tests?|__tests__)/|\.(test|spec)\.[cm]?[jt]sx?$|(^|/)test_[^/]*\.py$|_test\.(py|go|rb)$|Tests?\.(gd|cs|java|kt|swift)$|\.bats$")
                  tests = [f for f in changed if TEST_RE.search(f) and not META_RE.search(f) and Path(f).is_file()]
                  if ids:
                      all_ids = ids | {i.rsplit(".", 1)[0] for i in ids}
                      # `GOV-1.1` may also be written `GOV_1_1` (test identifiers cannot contain - or .).
                      pats = {i: re.compile(r"(?<![A-Za-z0-9-])" + re.escape(i).replace(r"\-", "[-_]").replace(r"\.", "[._]") + r"(?![A-Za-z0-9]|[._-]\d)") for i in all_ids}
                      traced = {}
                      for t in tests:
                          text = t + "\n" + Path(t).read_text(encoding="utf-8", errors="replace")
                          hits = {i for i, rx in pats.items() if rx.search(text)}
                          if hits:
                              traced[t] = sorted(hits); covered_ids.update(hits)
                      if traced:
                          ok("traceability: " + "; ".join(f"{t} -> {', '.join(h)}" for t, h in traced.items()))
                      elif tests:
                          err("Traceability: changed tests (" + ", ".join(tests) + ") do not cite any requirement ID from the spec. Name or comment each test with the ID it verifies (e.g. `GOV-1.1`).")
                      else:
                          err("Traceability: code changed but no test was added or changed. Add or update a test that cites the acceptance criterion IDs it verifies.")

          # 9. ROLES. Only the spec-author role (roles.yml) may change spec paths. Checks the PR opener and the
          #    author and committer of every commit in the PR. Git identities are self-declared and agents that
          #    push with Ky's token appear as KyPython, so this proves declared identities only.
          if is_pr and roles is not None:
              head = os.environ.get("PR_HEAD_SHA", "")
              log = git("log", "--format=%H%x1f%an%x1f%ae%x1f%cn%x1f%ce", f"{base}..{head}") if base and head else ""
              def ident(name, email):
                  m = re.match(r"^(?:\d+\+)?([^@]+)@users\.noreply\.github\.com$", email or "", re.I)
                  return {x.lower() for x in (name, email, m.group(1) if m else None) if x}
              people = []  # (label, identity set)
              if os.environ.get("PR_AUTHOR"):
                  people.append((f"PR opener @{os.environ['PR_AUTHOR']}", {os.environ["PR_AUTHOR"].lower()}))
              for line in log.splitlines():
                  sha, an, ae, cn, ce = (line.split("\x1f") + [""] * 5)[:5]
                  people.append((f"{sha[:7]} author {an} <{ae}>", ident(an, ae)))
                  if ce.lower() != "noreply@github.com":  # GitHub web-flow committer = platform, not a person
                      people.append((f"{sha[:7]} committer {cn} <{ce}>", ident(cn, ce)))
              def role_of(ids):
                  if ids & SPEC_AUTHORS: return "spec-author"
                  if ids & CODERS: return "coder"
                  return "unknown"
              if spec_changes:
                  bad = [label + f" (role: {role_of(ids)})" for label, ids in people if not ids & SPEC_AUTHORS]
                  if bad:
                      err("Role gate: only the spec-author role (" + ", ".join(sorted(SPEC_AUTHORS)) + ") may change spec paths. "
                          "Not spec authors: " + "; ".join(bad) + ". Coders implement existing specs; Kiro writes them.")
                  else:
                      ok("role gate: every PR opener/commit identity that touched specs is a spec author (git identities are self-declared; "
                         "commits pushed with KyPython's token count as KyPython)")
              if os.environ.get("REPO") == "KyPython/ai-governance" and "roles.yml" in changed:
                  bad = [label for label, ids in people if OWNER not in ids]
                  if bad:
                      err(f"Role gate: roles.yml may only be changed by the owner ({OWNER}). Not the owner: " + "; ".join(bad))
                  else:
                      ok("role gate: roles.yml changed by the owner identity only")
              coders = sorted({label for label, ids in people if role_of(ids) == "coder"})
              if coders:
                  print("Coder identities in this PR: " + "; ".join(coders))

          # 7. Governance files touched -> human code-owner review is mandatory.
          gov = [f for f in changed if re.search(r"^(\.github/|\.husky/|\.claude/|\.cursor/)|(^|/)(AGENTS\.md|CLAUDE\.md|CODEOWNERS)$", f)]
          if gov:
              print("::notice::This PR changes governance files; Ky must review these before merging: " + ", ".join(gov))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("### policy\n")
              for p in passed: s.write(f"- PASS {p}\n")
              for w in warnings: s.write(f"- WARN {w}\n")
              for e in errors: s.write(f"- FAIL {e}\n")

          # Scorecard outputs (read by the verdict job). Changed lines exclude lockfiles.
          if is_pr:
              mb = git("merge-base", os.environ.get("PR_BASE_SHA", ""), os.environ.get("PR_HEAD_SHA", "")).strip()
              rng = f"{mb}..{os.environ.get('PR_HEAD_SHA', '')}" if mb else ""
          else:
              b4 = os.environ.get("PUSH_BEFORE", "")
              rng = f"{b4}..{os.environ.get('PUSH_AFTER', '')}" if b4 and set(b4) != {"0"} else ""
          added = deleted = files = 0
          for row in (git("diff", "--numstat", rng).splitlines() if rng else []):
              parts = row.split("\t")
              if len(parts) < 3:
                  continue
              files += 1
              if re.search(r"(^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock|poetry\.lock|uv\.lock|Cargo\.lock|go\.sum)$", parts[2]):
                  continue
              added += int(parts[0]) if parts[0].isdigit() else 0
              deleted += int(parts[1]) if parts[1].isdigit() else 0
          if os.environ.get("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write(f"requirement_ids={','.join(sorted(covered_ids))}\nspec={','.join(spec_refs)}\npolicy_errors={len(errors)}\n"
                          f"lines_added={added}\nlines_deleted={deleted}\nfiles_changed={files}\n")
          sys.exit(1 if errors else 0)

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned + checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum --check --strict
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan commit range (fail-closed)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          have() { [ -n "${1:-}" ] && git cat-file -e "${1}^{commit}" 2>/dev/null; }
          log_opts="--all --full-history"
          if [ "$EVENT_NAME" = "pull_request" ] && have "$PR_BASE_SHA" && have "$PR_HEAD_SHA"; then
            log_opts="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && have "$PUSH_BEFORE"; then
            log_opts="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          # Merge commits are included on purpose: a conflict resolution can introduce a secret.
          echo "gitleaks --log-opts=\"${log_opts}\""
          config_args=()
          if [ -f .gitleaks.toml ]; then config_args=(--config .gitleaks.toml); fi
          gitleaks git . "${config_args[@]}" --log-opts "${log_opts}" --redact=100 --exit-code=2 --no-banner --verbose
          status=$?
          if [ "$status" = "0" ]; then
            echo "- secret-scan: no secrets in \`${log_opts}\`" >> "$GITHUB_STEP_SUMMARY"; exit 0
          elif [ "$status" = "2" ]; then
            echo "::error::gitleaks found credential material. Rotate it at the provider first, then rewrite it out of the branch history (deleting in a later commit is not enough)."
            exit 1
          fi
          echo "::error::gitleaks failed to run (exit ${status}). Failing closed."
          exit 1

  verdict:
    name: verdict
    if: always()
    needs: [quality, policy, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      verdict: ${{ steps.v.outputs.verdict }}
      summary: ${{ steps.card.outputs.summary }}
    steps:
      - name: Scorecard (machine-readable summary)
        id: card
        if: always()
        env:
          QUALITY: ${{ needs.quality.result }}
          POLICY: ${{ needs.policy.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          RUN_QUALITY: ${{ inputs.run-quality }}
          TESTS_PASSED: ${{ needs.quality.outputs.tests_passed }}
          TESTS_FAILED: ${{ needs.quality.outputs.tests_failed }}
          TESTS_TOTAL: ${{ needs.quality.outputs.tests_total }}
          REQUIREMENT_IDS: ${{ needs.policy.outputs.requirement_ids }}
          SPEC: ${{ needs.policy.outputs.spec }}
          POLICY_ERRORS: ${{ needs.policy.outputs.policy_errors }}
          LINES_ADDED: ${{ needs.policy.outputs.lines_added }}
          LINES_DELETED: ${{ needs.policy.outputs.lines_deleted }}
          FILES_CHANGED: ${{ needs.policy.outputs.files_changed }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python3 {0}
        run: |
          # SCORECARD: reports only; it never changes the verdict. Schema: ai-governance-summary/v1.
          import json, os
          e = os.environ.get
          def num(k):
              v = e(k) or ""; return int(v) if v.isdigit() else None
          def lst(k):
              return [x for x in (e(k) or "").split(",") if x]
          jobs = {"quality": e("QUALITY") or "unknown", "policy": e("POLICY") or "unknown", "secret-scan": e("SECRETS") or "unknown"}
          failed = [j for j, r in jobs.items() if r != "success" and not (j == "quality" and r == "skipped" and e("RUN_QUALITY") == "false")]
          added, deleted = num("LINES_ADDED"), num("LINES_DELETED")
          card = {
              "schema": "ai-governance-summary/v1",
              "repo": e("REPO"), "pr": num("PR_NUMBER"), "pr_author": e("PR_AUTHOR") or None, "head_sha": e("HEAD_SHA"),
              "verdict": "pass" if not failed else "fail",
              "jobs": jobs, "failed_checks": len(failed), "failed_check_names": failed,
              "policy_errors": num("POLICY_ERRORS"),
              "tests": {"passed": num("TESTS_PASSED"), "failed": num("TESTS_FAILED"), "total": num("TESTS_TOTAL")},
              "spec": lst("SPEC"), "requirement_ids": lst("REQUIREMENT_IDS"),
              "changed_lines": {"added": added, "deleted": deleted, "total": None if added is None else added + (deleted or 0)},
              "files_changed": num("FILES_CHANGED"),
              "run_url": e("RUN_URL"),
          }
          blob = json.dumps(card, separators=(",", ":"))
          with open("ai-governance-summary.json", "w") as f:
              json.dump(card, f, indent=2)
          if e("GITHUB_OUTPUT"):
              with open(e("GITHUB_OUTPUT"), "a") as o:
                  o.write(f"summary={blob}\n")
          t = card["tests"]
          tests = "not recognized" if t["total"] is None else f"{t['passed']}/{t['total']}" + (f" ({t['failed']} failed)" if t["failed"] else "")
          if e("GITHUB_STEP_SUMMARY"):
              with open(e("GITHUB_STEP_SUMMARY"), "a") as s:
                  s.write("### ai-governance scorecard\n\n| verdict | tests passed/total | requirement IDs covered | failed checks | changed lines (+/-) | files |\n|---|---|---|---|---|---|\n")
                  s.write(f"| {card['verdict']} | {tests} | {', '.join(card['requirement_ids']) or '-'} | {card['failed_checks']} | "
                          f"{card['changed_lines']['total']} (+{added}/-{deleted}) | {card['files_changed']} |\n\n")
                  s.write("```json\n" + json.dumps(card, indent=2) + "\n```\n")
          print("AI_GOVERNANCE_SUMMARY " + blob)

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-governance-summary
          path: ai-governance-summary.json
          retention-days: 90
          if-no-files-found: warn

      - id: v
        env:
          QUALITY: ${{ needs.quality.result }}
          POLICY: ${{ needs.policy.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          RUN_QUALITY: ${{ inputs.run-quality }}
        run: |
          echo "quality=${QUALITY} policy=${POLICY} secret-scan=${SECRETS}"
          echo "### verdict: quality=${QUALITY}, policy=${POLICY}, secret-scan=${SECRETS}" >> "$GITHUB_STEP_SUMMARY"
          if { [ "$QUALITY" = "success" ] || { [ "$QUALITY" = "skipped" ] && [ "$RUN_QUALITY" = "false" ]; }; } && [ "$POLICY" = "success" ] && [ "$SECRETS" = "success" ]; then
            echo "verdict=pass" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "verdict=fail" >> "$GITHUB_OUTPUT"
          echo "::error::AI governance gate failed. Fix the failing job(s); do not bypass, weaken, or edit the gate to pass."
          exit 1
